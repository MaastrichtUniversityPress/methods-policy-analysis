# Configuration of _toc.yml file is explained in detail here: https://jupyterbook.org/en/stable/structure/toc.html and https://sphinx-external-toc.readthedocs.io/en/latest/user_guide/sphinx.html

format: jb-book
root: intro.md

parts:
  - caption: Foundations
    chapters:
    - file: partA/chapter_A.1.md
      sections:
      - file: partA/section_A.1.01.md
  - caption: Back matter
    chapters:
    - file: references.md
    - file: changelog.md
    - file: credits.md
